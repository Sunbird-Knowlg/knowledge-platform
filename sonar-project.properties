# SonarCloud analysis config (see .github/workflows/sonarcloud.yml).
sonar.projectKey=Sunbird-Knowlg_knowledge-platform
sonar.organization=sunbird-knowlg-1
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/src/test/**,**/*Spec.scala,**/*Test.scala,**/Test*.java

# S1313 (hardcoded IP), S2068 (hardcoded credentials), S4507 (debug features):
# test fixtures for the SSRF blocklist (SafeUrlValidatorTest) and facet-field
# probing (SearchInputValidatorTest) use these values intentionally as inputs
# under test, not as leaked secrets/hosts.
sonar.issue.ignore.multicriteria=e1,e2,e3
sonar.issue.ignore.multicriteria.e1.ruleKey=java:S1313
sonar.issue.ignore.multicriteria.e1.resourceKey=**/src/test/**
sonar.issue.ignore.multicriteria.e2.ruleKey=java:S2068
sonar.issue.ignore.multicriteria.e2.resourceKey=**/src/test/**
sonar.issue.ignore.multicriteria.e3.ruleKey=java:S4507
sonar.issue.ignore.multicriteria.e3.resourceKey=**/src/test/**
